  location ^~ /api/ {
    proxy_pass https://api.va-tools.ru/;
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_hide_header X-CO-VA-Preview;
    proxy_pass_header Content-Type;
    proxy_pass_header Content-Security-Policy;
    proxy_pass_header Content-Disposition;
    add_header Cache-Control "no-store" always;
    # API JSON and status are the upstream response, not static preview MIME.
    proxy_set_header Host api.va-tools.ru;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name api.va-tools.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
