server {
  listen 3000 default_server;
  server_name prof.va-tools.ru _;
  root /usr/share/nginx/html;
  index index.html;

  # Generated CSS and JavaScript are content-versioned for atomic updates.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  include /etc/nginx/professional-api.conf;

  location = /booking { try_files /booking.html =404; add_header Cache-Control "no-cache"; }
  location ^~ /booking/ { try_files /booking.html =404; add_header Cache-Control "no-cache"; }
  location ~* \.(?:js|mjs|css|json|webmanifest|svg|png|jpg|jpeg|webp|woff2?)$ { try_files $uri =404; add_header Cache-Control "no-cache"; }
  location = /service-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}


# The same container serves a locally cached, complete staging snapshot.
# No browser request is forwarded to GitHub. GitHub is contacted only by the
# independent snapshot refresher, which keeps the last successful checkout.
server {
  listen 3000;
  server_name professional-volokovykh.msk1.amvera.tech;
  root /var/cache/professional-preview/current;
  index index.html;
  include /etc/nginx/professional-api.conf;

  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/json json;
    application/manifest+json webmanifest;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/x-icon ico;
    font/woff woff;
    font/woff2 woff2;
  }
  default_type application/octet-stream;
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header X-CO-VA-Preview "staging" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = / {
    limit_except GET { deny all; }
    try_files /index.html =503;
  }
  location = /booking {
    limit_except GET { deny all; }
    try_files /booking.html =503;
  }
  location ^~ /booking/ {
    limit_except GET { deny all; }
    try_files /booking.html =503;
  }
  location = /invite { return 302 /invite/$is_args$args; }
  location = /invite/ {
    limit_except GET { deny all; }
    try_files /invite/index.html =503;
  }
  location ^~ /assets/ {
    limit_except GET { deny all; }
    try_files $uri =404;
  }
  location = /__preview_revision {
    limit_except GET { deny all; }
    default_type text/plain;
    try_files $uri =503;
  }
  location ~ ^/(?:professional\.js|service-worker\.js|index\.html|booking\.html|verify-email\.html|reset-password\.html|app-icon\.svg|icon-192\.png|manifest\.webmanifest)$ {
    limit_except GET { deny all; }
    try_files $uri =404;
  }
  location ~ ^/(?:chat|core|css|invite|journal|online-booking|professional|settings|timetable|ui)/[^?]+\.(?:js|mjs|css|json|html|webmanifest|svg|png|jpe?g|webp|ico|woff2?)$ {
    limit_except GET { deny all; }
    try_files $uri =404;
  }
  location / { return 404; }
}
