# One Amvera service, two hostnames. Production remains built from main.
map $uri $preview_content_type {
  default "application/octet-stream";
  "/" "text/html; charset=utf-8";
  "/booking" "text/html; charset=utf-8";
  "/invite/" "text/html; charset=utf-8";
  ~^/booking/ "text/html; charset=utf-8";
  ~*\.html$ "text/html; charset=utf-8";
  ~*\.(?:js|mjs)$ "application/javascript; charset=utf-8";
  ~*\.css$ "text/css; charset=utf-8";
  ~*\.json$ "application/json; charset=utf-8";
  ~*\.webmanifest$ "application/manifest+json; charset=utf-8";
  ~*\.svg$ "image/svg+xml";
  ~*\.png$ "image/png";
  ~*\.jpe?g$ "image/jpeg";
  ~*\.webp$ "image/webp";
  ~*\.ico$ "image/x-icon";
  ~*\.woff2$ "font/woff2";
  ~*\.woff$ "font/woff";
}

server {
  listen 3000 default_server;
  server_name prof.va-tools.ru _;
  root /usr/share/nginx/html;
  index index.html;

  # Generated CSS and JavaScript are content-versioned for atomic updates.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  include /etc/nginx/professional-api.conf;

  location = /booking { try_files /booking.html =404; add_header Cache-Control "no-cache"; }
  location ^~ /booking/ { try_files /booking.html =404; add_header Cache-Control "no-cache"; }
  location ~* \.(?:js|mjs|css|json|webmanifest|svg|png|jpg|jpeg|webp|woff2?)$ { try_files $uri =404; add_header Cache-Control "no-cache"; }
  location = /service-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}


# The existing standard Amvera domain serves staging source, never the main build.
server {
  listen 3000;
  server_name professional-volokovykh.msk1.amvera.tech;
  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
  set $staging_raw https://raw.githubusercontent.com/co-va/professional/staging;

  # Same authenticated Core API contract as before the split.
  # This is frontend preview, NOT an isolated database. Use test accounts.
  include /etc/nginx/professional-api.conf;

  # Never forward user cookies, credentials or request bodies to GitHub.
  proxy_pass_request_headers off;
  proxy_pass_request_body off;
  proxy_set_header Host raw.githubusercontent.com;
  proxy_set_header Content-Length "";
  proxy_ssl_server_name on;
  proxy_ssl_name raw.githubusercontent.com;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_connect_timeout 8s;
  proxy_read_timeout 20s;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;
  proxy_hide_header Content-Type;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Content-Disposition;
  add_header Content-Type $preview_content_type always;
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header X-CO-VA-Preview "staging" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = / {
    limit_except GET { deny all; }
    proxy_pass $staging_raw/index.html;
  }
  location = /booking {
    limit_except GET { deny all; }
    proxy_pass $staging_raw/booking.html;
  }
  location ^~ /booking/ {
    limit_except GET { deny all; }
    proxy_pass $staging_raw/booking.html;
  }
  location = /invite {
    return 302 /invite/$is_args$args;
  }
  location = /invite/ {
    limit_except GET { deny all; }
    proxy_pass $staging_raw/invite/index.html;
  }
  location ~ ^/(?:professional\.js|service-worker\.js|index\.html|booking\.html|verify-email\.html|reset-password\.html|app-icon\.svg|icon-192\.png|manifest\.webmanifest)$ {
    limit_except GET { deny all; }
    proxy_pass $staging_raw$request_uri;
  }
  location ~ ^/(?:chat|core|css|invite|journal|online-booking|professional|settings|timetable|ui)/[^?]+\.(?:js|mjs|css|json|html|webmanifest|svg|png|jpe?g|webp|ico|woff2?)$ {
    limit_except GET { deny all; }
    proxy_pass $staging_raw$request_uri;
  }
  location / { return 404; }
}
