server {
  listen 3000;
  server_name prof.va-tools.ru _;
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    proxy_pass https://api.va-tools.ru/;
    proxy_set_header Host api.va-tools.ru;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name api.va-tools.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /booking { try_files /booking.html =404; add_header Cache-Control "no-cache"; }
  location ^~ /booking/ { try_files /booking.html =404; add_header Cache-Control "no-cache"; }
  location ~* \.(?:js|mjs|css|json|webmanifest|svg|png|jpg|jpeg|webp|woff2?)$ { try_files $uri =404; add_header Cache-Control "no-cache"; }
  location = /service-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
