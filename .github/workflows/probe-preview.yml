name: Probe Professional Preview

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/probe-preview.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe preview root and auth proxy
        shell: bash
        run: |
          set -u
          base='https://professional-volokovykh.msk1.amvera.tech'
          echo '=== ROOT ==='
          curl -sS -D - -o /tmp/root.body "$base/" | sed -n '1,20p'
          echo 'root-body:'; head -c 200 /tmp/root.body; echo
          echo '=== AUTH ME ==='
          curl -sS -D - -o /tmp/me.body "$base/api/auth/me" | sed -n '1,30p'
          echo 'me-body:'; head -c 500 /tmp/me.body; echo
          echo '=== AUTH LOGIN INVALID ==='
          curl -sS -D - -o /tmp/login.body -X POST "$base/api/auth/login" \
            -H 'Content-Type: application/json' \
            --data '{"identifier":"__probe__","password":"__probe__"}' | sed -n '1,30p'
          echo 'login-body:'; head -c 1000 /tmp/login.body; echo
