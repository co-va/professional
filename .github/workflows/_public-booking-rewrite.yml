name: One-shot Public Booking replacement

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/_public-booking-rewrite.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Repair executor replacement escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_rewrite_public_booking.py')
          text = path.read_text()
          old = "re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if old not in text:
              raise SystemExit('executor escape target missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Replace old public Booking flow
        run: python3 scripts/_rewrite_public_booking.py

      - name: Verify source
        run: |
          git diff --check
          node --check online-booking/booking-entry.js
          node --check online-booking/access.js
          node scripts/audit-professional-clean.mjs
          ! grep -q "import { renderAccess } from './access.js'" online-booking/booking-entry.js
          grep -q "await import('./access.js')" online-booking/booking-entry.js
          grep -q "renderEntry();" online-booking/booking-entry.js
          grep -q "personStatus.pdnActive" online-booking/access.js
          ! grep -q "startLegalLookup\|activeConsentIds\|legalLookup\|requiredBookingDocuments\|onExitToAccount" online-booking/access.js
          grep -q "function initialStep()" online-booking/access.js
          grep -q "return { kind: 'mode', index: 0 };" online-booking/access.js
          grep -q "CORE HANDOFF: заменить guest .*booking-state" PROJECT_STATE.md

      - name: Verify container build
        run: docker build -t professional-public-booking .

      - name: Commit product replacement
        run: |
          git config user.name "co-tools-maintenance"
          git config user.email "co-tools-maintenance@users.noreply.github.com"
          git add booking.html online-booking/booking-entry.js online-booking/access.js ui/booking/booking.css PROJECT_STATE.md
          git commit -m "Replace public Booking with lightweight entry flow"
          git push origin HEAD:staging

      - name: Remove one-shot executor
        if: success()
        run: |
          git rm scripts/_rewrite_public_booking.py .github/workflows/_public-booking-rewrite.yml
          git commit -m "Remove one-shot public Booking rewrite executor"
          git push origin HEAD:staging
