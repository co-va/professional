name: Verify Professional login errors once

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Check simulated login statuses and unauthenticated API reachability
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          globalThis.location={hostname:'professional-volokovykh.msk1.amvera.tech'};
          const stored=new Map();
          globalThis.localStorage={
            getItem:key=>stored.get(key)||null,
            setItem:(key,v)=>stored.set(key,v),
            removeItem:key=>stored.delete(key),
          };
          const {login}=await import('./core/auth.js');
          const setResponse=(status,body,contentType='text/html')=>{
            globalThis.fetch=async(url)=>{
              assert.equal(url,'/api/auth/login');
              return new Response(body,{status,headers:{'Content-Type':contentType}});
            };
          };
          setResponse(502,'<html>Bad Gateway</html>');
          await assert.rejects(()=>login('example@example.com','test'),/HTTP 502/);
          setResponse(401,JSON.stringify({message:'Неверный телефон, email или пароль'}),'application/json');
          await assert.rejects(()=>login('example@example.com','test'),/Неверный телефон, email или пароль/);
          setResponse(401,'<html>Unauthorized</html>');
          await assert.rejects(()=>login('example@example.com','test'),/Вход не подтверждён/);
          setResponse(429,'');
          await assert.rejects(()=>login('example@example.com','test'),/Слишком много запросов/);
          globalThis.fetch=async()=>{throw new TypeError('Failed to fetch');};
          await assert.rejects(()=>login('example@example.com','test'),/Не удалось связаться/);
          setResponse(200,'<html>Unexpected successful HTML</html>');
          await assert.rejects(()=>login('example@example.com','test'),/неполный ответ/);
          setResponse(200,JSON.stringify({accessToken:'test-only-token'}),'application/json');
          await login('example@example.com','test');
          assert.equal(stored.get('va-tools.auth.token'),'test-only-token');
          console.log('PASS: 502 / 401 / 429 / network / incomplete response / success');
          NODE
          echo "Unauthenticated endpoints (no credentials sent):"
          for url in 'https://professional-volokovykh.msk1.amvera.tech/' 'https://professional-volokovykh.msk1.amvera.tech/api/auth/me' 'https://api.va-tools.ru/auth/me'; do
            printf '%s: ' "$url"
            curl -L --retry 0 --connect-timeout 5 --max-time 15 -sS -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' "$url" || true
          done
          node -e "import('./professional.js').then(()=>console.log('Professional entry linked')).catch(e=>{if(e instanceof ReferenceError && /document|window/.test(e.message)){console.log('Browser-only entry; skipped node import')}else{console.error(e);process.exitCode=1;}})"
          node --check core/auth.js
          node scripts/audit-professional-clean.mjs
          docker build -t professional-login-diagnostics .
      - name: Remove temporary verifier
        if: always()
        run: |
          set -euo pipefail
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git rm .github/workflows/_verify-login-errors-once.yml
          git commit -m 'Remove temporary Professional login diagnostics'
          git push origin HEAD:staging
