name: Professional staging contract

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

permissions:
  contents: read

jobs:
  structural-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser syntax
        run: |
          node --check professional.js
          node --check professional/workspace.js
          node --check core/access.js
          node --check core/runtime/server-sync.js
          node --check core/profile/runtime.js
      - name: Verify platform-driven tools and lightweight entry
        run: node scripts/check-light-entry.mjs
      - name: Audit single Professional runtime and no duplicates
        run: node scripts/audit-professional-clean.mjs
      - name: Verify unchanged shared UI boundaries
        run: node scripts/guard-shared-ui.mjs
