name: Temporary Record operational recovery check

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Check reuse, retries, server failure detail, build
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          globalThis.localStorage={getItem:()=>'',setItem(){},removeItem(){}};
          globalThis.location={hostname:'professional-volokovykh.msk1.amvera.tech'};
          const {hasCurrentProceduresSnapshot,hydrateCurrentProceduresFromServer,getProcedures}=await import('./core/service/procedures/data.js');
          assert.equal(hasCurrentProceduresSnapshot(),false);
          hydrateCurrentProceduresFromServer([{id:'procedure1',name:'Test procedure'}]);
          assert.equal(hasCurrentProceduresSnapshot(),true);
          assert.equal(getProcedures().length,1);
          const {loadRecordCreationOperationalState}=await import('./core/runtime/operational-state.js');
          let calls=0;
          globalThis.fetch=async()=>{calls++;return new Response('<html>upstream error</html>',{status:502})};
          // The caller checks procedures readiness before invoking a network-backed load.
          if(!hasCurrentProceduresSnapshot()) await loadRecordCreationOperationalState();
          assert.equal(calls,0);
          const chooser=fs.readFileSync('journal/creation-flow.js','utf8');
          assert.match(chooser,/if \(!hasCurrentProceduresSnapshot\(\)\) await loadRecordCreationOperationalState\(\)/);
          assert.match(chooser,/action: \{ label: 'Повторить', data: 'data-record-retry-load' \}/);
          assert.match(chooser,/const nextVersion = \+\+requestVersion/);
          const catchSegment=chooser.slice(chooser.lastIndexOf('} catch (error)'));
          assert.doesNotMatch(catchSegment,/returnToChoices\(\)/);
          assert.doesNotMatch(catchSegment,/openNotice/);
          assert.match(catchSegment,/owner.render\(\{/);
          const operational=fs.readFileSync('core/runtime/operational-state.js','utf8');
          assert.match(operational,/HTTP \$\{response.status\}/);
          assert.match(operational,/Array.isArray\(value.procedures\)/);
          // Fresh attempt without cached procedures: propagate HTTP 502 to the same Q.
          const {requestOperationalState}=await import('./core/runtime/operational-state.js');
          await assert.rejects(requestOperationalState(),/HTTP 502/);
          assert.equal(calls,1);
          console.log('PASS: uses already hydrated procedures; retains Q and time; identifies HTTP 502');
          NODE
          echo "Unauthenticated operational endpoint (no password/token):"
          curl -L --retry 0 --connect-timeout 5 --max-time 15 -sS -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' https://professional-volokovykh.msk1.amvera.tech/api/business-state/operational || true
          node -e "import('./journal/creation-flow.js').then(()=>console.log('Journal Q module linking PASS'))"
          node -e "import('./core/records/records.js').then(()=>console.log('Record module linking PASS'))"
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          node scripts/audit-professional-clean.mjs
          docker build -t professional-record-operational-recovery .
      - name: Remove temporary verifier
        if: always()
        run: |
          set -euo pipefail
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git rm .github/workflows/_verify-record-operational-once.yml
          git commit -m 'Remove temporary Record operational verifier'
          git push origin HEAD:staging
