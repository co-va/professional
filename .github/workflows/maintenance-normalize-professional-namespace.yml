name: Maintenance / Normalize Professional Namespace

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/maintenance-normalize-professional-namespace.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Normalize internal Professional namespace
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const roots = [
            'core', 'journal', 'timetable', 'settings', 'chat',
            'online-booking', 'invite', 'ui', 'professional.js', 'service-worker.js'
          ];
          const allowedExt = new Set(['.js', '.mjs', '.html', '.css']);
          const files = [];

          function walk(target) {
            if (!fs.existsSync(target)) return;
            const stat = fs.statSync(target);
            if (stat.isDirectory()) {
              for (const name of fs.readdirSync(target)) walk(path.join(target, name));
              return;
            }
            if (allowedExt.has(path.extname(target))) files.push(target);
          }
          roots.forEach(walk);

          const exact = new Map([
            ['book:v2-navigation-request', 'va-tools:v2-navigation-request'],
            ['activateBookDemo', 'activateDemo'],
            ['loadBookAccess', 'loadAccess'],
            ['getBookAccess', 'getAccess'],
            ['getBookCapability', 'getCapability'],
            ['canUseBookCapability', 'canUseCapability'],
            ['getBookLimit', 'getLimit'],
            ['__bookTimeUsageChangeHandler', '__professionalTimeUsageChangeHandler'],
          ]);

          let changed = 0;
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            let after = before;
            for (const [from, to] of exact) after = after.split(from).join(to);
            after = after.split('book:').join('professional:');
            after = after.split('book.').join('professional.');
            if (after !== before) {
              fs.writeFileSync(file, after);
              changed += 1;
              console.log(file);
            }
          }

          const forbidden = /(book:|book\.|activateBookDemo|loadBookAccess|getBookAccess|getBookCapability|canUseBookCapability|getBookLimit|__bookTimeUsageChangeHandler)/;
          const leftovers = [];
          for (const file of files) {
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            lines.forEach((line, index) => {
              if (forbidden.test(line)) leftovers.push(`${file}:${index + 1}:${line.trim()}`);
            });
          }
          if (leftovers.length) {
            console.error('Retired internal markers remain:\n' + leftovers.join('\n'));
            process.exit(1);
          }
          if (!changed) {
            console.error('No namespace changes were produced');
            process.exit(1);
          }
          console.log(`Changed files: ${changed}`);
          NODE

          git diff --check
          while IFS= read -r file; do
            case "$file" in
              *.js|*.mjs) node --check "$file" ;;
            esac
          done < <(git diff --name-only)

          git config user.name "co-tools-maintenance"
          git config user.email "co-tools-maintenance@users.noreply.github.com"
          git add core journal timetable settings chat online-booking invite ui professional.js service-worker.js
          git commit -m "Normalize Professional internal namespace"
          git push origin HEAD:staging

      - name: Remove one-time maintenance workflow
        shell: bash
        run: |
          git pull --ff-only origin staging
          rm -f .github/workflows/maintenance-normalize-professional-namespace.yml
          git add -A .github/workflows
          git commit -m "Remove one-time namespace maintenance workflow"
          git push origin HEAD:staging
