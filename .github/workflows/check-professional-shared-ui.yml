name: Professional / Shared UI

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Professional
        uses: actions/checkout@v4

      - name: Validate Shared UI guard
        run: node scripts/guard-shared-ui.mjs
