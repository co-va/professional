name: Maintenance / Remove accidental noop branch

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/maintenance-remove-noop-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove accidental branch and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete __noop__
          git config user.name 'co-tools-maintenance'
          git config user.email 'co-tools-maintenance@users.noreply.github.com'
          git rm .github/workflows/maintenance-remove-noop-branch.yml
          git commit -m 'Remove one-time noop branch cleanup workflow'
          git push origin HEAD:staging
