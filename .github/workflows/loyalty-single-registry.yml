name: Loyalty E single registry

on:
  push:
    branches: [staging]
    paths:
      - "core/loyalty/**"
      - "core/people/**"
      - "scripts/ci/loyalty-single-registry-check.mjs"
      - ".github/workflows/loyalty-single-registry.yml"
  pull_request:
    branches: [staging]
    paths:
      - "core/loyalty/**"
      - "core/people/**"
      - "scripts/ci/loyalty-single-registry-check.mjs"
      - ".github/workflows/loyalty-single-registry.yml"

permissions:
  contents: read

jobs:
  single-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/ci/loyalty-single-registry-check.mjs
