name: Verify Journal first-step performance once

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Verify faster first step and app bundle
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const day = fs.readFileSync('journal/день.js', 'utf8');
          const creation = fs.readFileSync('journal/creation-flow.js', 'utf8');
          const records = fs.readFileSync('core/records/records.js', 'utf8');
          assert.match(day, /function loadJournalCreationModule\(\)/);
          assert.match(day, /requestIdleCallback/);
          assert.match(day, /await loadJournalCreationModule\(\)/);
          assert.doesNotMatch(day, /activeTime|clockTimer|scheduleLiveTimeRefresh|currentTimeForDay/);
          assert.match(creation, /recordFlow = openRecords\(/);
          assert.match(creation, /window\.setTimeout\(\(\) => \{/);
          assert.match(creation, /loadRecordCreationOperationalState\(\)/);
          assert.match(records, /const grid = getAvailabilityGrid\(\{ date, workplaceId \}\)/);
          assert.match(records, /getTimeGridMinuteState\(grid, value\)/);
          assert.doesNotMatch(records, /getTimeAvailabilityAt/);
          const note = fs.readFileSync('journal/note-editor.js','utf8');
          assert.match(note, /required: false, allowClear: true/);
          const journal = fs.readFileSync('journal/journal.js','utf8');
          assert.match(journal, /root\.querySelector\('\[data-record-creation-flow\]'\)/);
          console.log('Journal first-step and invariant guards PASS');
          NODE
          node -e "import('./journal/creation-flow.js').then(() => console.log('creation module linking PASS'))"
          node -e "import('./journal/день.js').then(() => console.log('Journal Day module linking PASS'))"
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          node scripts/audit-professional-clean.mjs
          git diff --check
          docker build -t professional-journal-first-step .
      - name: Remove temporary verifier
        if: success()
        run: |
          set -euo pipefail
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git rm .github/workflows/_verify-journal-first-step.yml
          git commit -m 'Remove temporary Journal first-step verifier'
          git push origin HEAD:staging
