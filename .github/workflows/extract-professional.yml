name: Extract Professional

on:
  workflow_dispatch:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/extract-professional.yml
      - scripts/extract-professional.mjs
      - scripts/run-extraction.mjs
      - scripts/overrides/**

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Professional
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Checkout core source
        uses: actions/checkout@v4
        with:
          repository: co-va/core
          ref: main
          path: source
          persist-credentials: false

      - name: Extract clean Professional
        shell: bash
        run: |
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          SOURCE_SHA="$SOURCE_SHA" node scripts/run-extraction.mjs

      - name: Apply Professional runtime invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Professional auth surfaces must use the full viewport as their host,
          # with the sticker centered independently inside it.
          auth_path = Path('ui/auth/auth.css')
          auth = auth_path.read_text()
          auth_rules = '''
.app-shell.app-shell--auth{width:100%;max-width:none;min-height:100dvh;margin:0;padding-top:0;background:var(--surface-dark);box-shadow:none}
.app-shell.app-shell--auth>.v2-sticker-screen{width:min(100%,var(--app-max-width));margin-left:auto;margin-right:auto}
'''
          if '.app-shell.app-shell--auth{' not in auth:
              auth += auth_rules
          auth_path.write_text(auth)

          entry_path = Path('professional.js')
          entry = entry_path.read_text()

          login_marker = "function renderLogin(message = '') {\n  setThemeColor('#F5F5F3');\n  app.classList.remove('app-shell--booking');"
          login_replacement = login_marker + "\n  app.classList.add('app-shell--auth');"
          if login_replacement not in entry:
              if login_marker not in entry:
                  raise SystemExit('Professional login auth-class marker not found')
              entry = entry.replace(login_marker, login_replacement, 1)

          reset_marker = "function renderPasswordResetRequest() {\n  setThemeColor('#F5F5F3');\n  app.classList.remove('app-shell--booking');"
          reset_replacement = reset_marker + "\n  app.classList.add('app-shell--auth');"
          if reset_replacement not in entry:
              if reset_marker not in entry:
                  raise SystemExit('Professional reset auth-class marker not found')
              entry = entry.replace(reset_marker, reset_replacement, 1)

          workspace_marker = "function renderWorkspace() {\n  setThemeColor('#2F3338');\n  app.classList.remove('app-shell--booking');"
          workspace_replacement = workspace_marker + "\n  app.classList.remove('app-shell--auth');"
          if workspace_replacement not in entry:
              if workspace_marker not in entry:
                  raise SystemExit('Professional workspace auth-class marker not found')
              entry = entry.replace(workspace_marker, workspace_replacement, 1)

          entry_path.write_text(entry)

          # nginx defaults to HTTP/1.0 for proxy_pass. The production API edge
          # answers that with HTTP 426 Upgrade Required, so preview proxy must use 1.1.
          nginx_path = Path('nginx.conf')
          nginx = nginx_path.read_text()
          proxy_marker = '    proxy_set_header Host api.va-tools.ru;\n'
          proxy_replacement = (
              proxy_marker
              + '    proxy_http_version 1.1;\n'
              + '    proxy_set_header Connection "";\n'
          )
          if 'proxy_http_version 1.1;' not in nginx:
              if proxy_marker not in nginx:
                  raise SystemExit('Professional API proxy marker not found')
              nginx = nginx.replace(proxy_marker, proxy_replacement, 1)
          nginx_path.write_text(nginx)
          PY

      - name: Validate extracted JavaScript
        shell: bash
        run: |
          node --check professional.js
          node --check service-worker.js
          find core journal timetable settings chat online-booking invite ui \
            -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Validate Professional runtime invariants
        shell: bash
        run: |
          grep -F 'proxy_http_version 1.1;' nginx.conf
          grep -F 'app-shell--auth' professional.js
          grep -F '.app-shell.app-shell--auth' ui/auth/auth.css

      - name: Remove source checkout
        shell: bash
        run: rm -rf source

      - name: Validate Docker build
        shell: bash
        run: docker build --tag co-va-professional-check .

      - name: Commit extracted application
        shell: bash
        run: |
          git config user.name "co-tools"
          git config user.email "a.volokovykh@yandex.ru"
          git add -A
          if git diff --cached --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git commit -m "Extract Professional from core main ${SOURCE_SHA}"
          git push origin HEAD:staging
