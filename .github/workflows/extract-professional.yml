name: Extract Professional

on:
  workflow_dispatch:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/extract-professional.yml
      - scripts/extract-professional.mjs
      - scripts/run-extraction.mjs
      - scripts/overrides/**

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Professional
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Checkout core source
        uses: actions/checkout@v4
        with:
          repository: co-va/core
          ref: main
          path: source
          persist-credentials: false

      - name: Extract clean Professional
        shell: bash
        run: |
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          SOURCE_SHA="$SOURCE_SHA" node scripts/run-extraction.mjs

      - name: Apply Professional UI invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ui/auth/auth.css')
          text = path.read_text()
          old = '.shared-login-screen{width:min(100%,var(--app-max-width));min-height:100dvh;background:var(--surface-dark)}'
          new = '.shared-login-screen{width:min(100%,var(--app-max-width));min-height:100dvh;margin:0 auto;background:var(--surface-dark)}'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('Professional login centering invariant not found')
          path.write_text(text)
          PY

      - name: Validate extracted JavaScript
        shell: bash
        run: |
          node --check professional.js
          node --check service-worker.js
          find core journal timetable settings chat online-booking invite ui \
            -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Remove source checkout
        shell: bash
        run: rm -rf source

      - name: Validate Docker build
        shell: bash
        run: docker build --tag co-va-professional-check .

      - name: Commit extracted application
        shell: bash
        run: |
          git config user.name "co-tools"
          git config user.email "a.volokovykh@yandex.ru"
          git add -A
          if git diff --cached --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git commit -m "Extract Professional from core main ${SOURCE_SHA}"
          git push origin HEAD:staging
