name: Professional / Staging smoke

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professional-staging-smoke
  cancel-in-progress: true

jobs:
  live-preview:
    name: Live preview
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed host split and safe API access
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          prod='https://prof.va-tools.ru'
          preview='https://professional-volokovykh.msk1.amvera.tech'
          fetch() {
            curl --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 75 --connect-timeout 10 --max-time 20 "$@"
          }
          echo 'Checking production host'
          fetch --fail -D "$tmp/main.headers" "$prod/" -o "$tmp/main.html"
          grep -q '/assets/' "$tmp/main.html"
          if grep -qi '^x-co-va-preview:' "$tmp/main.headers"; then
            echo 'Production must not be served as staging'; exit 1
          fi
          echo 'Checking staging preview host'
          expected="$(git ls-remote origin refs/heads/staging | cut -f1)"
          for attempt in $(seq 1 12); do
            current="$(curl -fsS --max-time 10 "$preview/__preview_revision" || true)"
            if [ "$current" = "$expected" ]; then break; fi
            sleep 5
          done
          test "$current" = "$expected"
          fetch --fail -D "$tmp/preview.headers" "$preview/" -o "$tmp/preview.html"
          grep -qi '^x-co-va-preview: staging' "$tmp/preview.headers"
          grep -qi '^content-type: text/html' "$tmp/preview.headers"
          grep -q '/assets/' "$tmp/preview.html"
          if grep -q 'src="professional.js"' "$tmp/preview.html"; then exit 1; fi
          for file in professional.js ui/v2/v2.css; do
            fetch --fail -D "$tmp/asset.headers" "$preview/$file" -o "$tmp/asset"
            grep -qi '^x-co-va-preview: staging' "$tmp/asset.headers"
            git fetch --quiet --depth=1 origin "$expected"
            git show "$expected:$file" > "$tmp/expected-asset"
            cmp "$tmp/expected-asset" "$tmp/asset"
            case "$file" in
              *.js) grep -qi '^content-type:.*javascript' "$tmp/asset.headers";;
              *.css) grep -qi '^content-type:.*text/css' "$tmp/asset.headers";;
            esac
          done
          status="$(fetch -H 'Authorization: Bearer ci-invalid-professional-token' -o "$tmp/api.body" -w '%{http_code}' "$preview/api/auth/me")"
          case "$status" in
            401|403) ;;
            *) echo "Unexpected preview API status: $status"; exit 1;;
          esac
          echo 'PASS: production compiled assets, staging snapshot assets, MIME and unauthorized API denial'

      - name: Verify actual browser renders login and workspace
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          node scripts/verify-preview-browser.mjs https://professional-volokovykh.msk1.amvera.tech/
