name: Check Professional

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Professional
        uses: actions/checkout@v4

      - name: Assert standalone repository
        shell: bash
        run: |
          forbidden=(
            "EXTRACTION_REPORT.md"
            "EXTRACTION_SCOPE.md"
            ".github/workflows/extract-professional.yml"
            "scripts/extract-professional.mjs"
            "scripts/run-extraction.mjs"
            "scripts/overrides"
            "scripts/extract-from-core.mjs"
            ".github/workflows/probe-preview.yml"
          )
          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "Forbidden migration artifact: $path"
              exit 1
            fi
          done

      - name: Assert Profile Q surface invariant
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('core/profile/profile.js', 'utf8');
          const start = source.indexOf('function openProfileData(');
          const end = source.indexOf('export function openProfileAppearanceQ', start);
          if (start < 0 || end < 0) throw new Error('Profile data surface not found');
          const block = source.slice(start, end);
          if (!block.includes('mountModal(') || !block.includes("variant:'q'")) {
            throw new Error('Profile data must open through canonical Q');
          }
          if (block.includes('mountV2ZLayer(')) {
            throw new Error('Profile data must not open as nested Z');
          }
          NODE

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check professional.js
          node --check service-worker.js
          find core journal timetable settings chat online-booking invite ui scripts \
            -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Audit Professional cleanliness
        shell: bash
        run: node scripts/audit-professional-clean.mjs

      - name: Validate Docker build
        shell: bash
        run: docker build --tag co-va-professional-check .
