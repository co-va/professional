name: Professional / Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professional-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Only repository staging may release to main
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_BRANCH" = staging
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require recorded operational evidence for release
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CORE_GATE_SHA: cc60a79f516d771e5d8d02420fb1dbd9cd5b9f60
        run: |
          set -euo pipefail
          gate_dir="$(mktemp -d "$RUNNER_TEMP/core-release-gate.XXXXXX")"
          trap 'rm -rf "$gate_dir"' EXIT
          git -C "$gate_dir" init -q
          git -C "$gate_dir" fetch --no-tags --depth=1 https://github.com/co-va/core.git "$CORE_GATE_SHA"
          git -C "$gate_dir" checkout --detach -q FETCH_HEAD
          test "$(git -C "$gate_dir" rev-parse HEAD)" = "$CORE_GATE_SHA"
          node "$gate_dir/tests/release-evidence.test.mjs"
          node "$gate_dir/scripts/check-release-evidence.mjs" "$BASE_SHA" "$HEAD_SHA" professional

      - name: Repository boundaries and exact duplicates
        if: success() || failure()
        run: node scripts/audit-professional-clean.mjs

      - name: Shared UI, entry and closure registry
        if: success() || failure()
        run: |
          node scripts/check-light-entry.mjs
          node scripts/check-ui-contract.mjs
          node scripts/guard-shared-ui.mjs
          node scripts/release/verify-closures.mjs

      - name: JavaScript syntax
        if: success() || failure()
        shell: bash
        run: |
          git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n1 node --check

      - name: Install pinned build and browser tools
        if: success() || failure()
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.12 playwright@1.56.1 eslint@9.39.1 globals@16.5.0 postcss@8.5.6
          npx playwright install chromium

      - name: Full JavaScript and CSS semantic audit
        if: success() || failure()
        run: node scripts/audit-professional-clean.mjs --symbols

      - name: Existing domain and UI regression checks
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for test in scripts/ci/*.mjs; do
            echo "::group::$test"
            if ! node "$test"; then
              echo "::error file=$test::Regression check failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Build production assets
        if: success() || failure()
        run: |
          node scripts/build-web.mjs
          test -s dist/index.html
          test -n "$(find dist/assets -name 'styles-*.css' -print -quit)"

      - name: Docker and nginx configuration
        if: success() || failure()
        run: |
          docker build --progress=plain -t professional-release .
          docker run --rm professional-release nginx -t
          bash scripts/verify-preview-routing.sh
