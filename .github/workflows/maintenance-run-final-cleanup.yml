name: Maintenance Final Professional Cleanup
on:
  push:
    branches: [staging]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1
      - run: python3 scripts/maintenance-final-legacy-cleanup.py
      - run: git diff --check
      - run: find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - run: node scripts/audit-professional-clean.mjs
      - name: Commit cleanup
        run: |
          git config user.name 'co-tools-maintenance'
          git config user.email 'co-tools-maintenance@users.noreply.github.com'
          git rm scripts/maintenance-final-legacy-cleanup.py
          git rm .github/workflows/maintenance-run-final-cleanup.yml
          git add -A
          git commit -m 'Remove remaining retired Professional implementation'
          git push origin HEAD:staging
