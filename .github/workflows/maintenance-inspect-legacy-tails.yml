name: Maintenance / Inspect Remaining Legacy Tails

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1
      - name: Inspect exact remaining tails and consumers
        run: |
          echo '=== LEGACY EXACT MARKERS ==='
          grep -RInE --exclude-dir=.git --exclude='PROJECT_STATE.md' --exclude='maintenance-inspect-legacy-tails.yml' "isOwnerBook|X-Book-Document-Id|availableBookText|sourceMode[^\n]*BOOK|book:|book\." . || true
          echo '=== availableBaseVersion ==='
          grep -RIn --exclude-dir=.git --exclude='maintenance-inspect-legacy-tails.yml' 'availableBaseVersion' . || true
          echo '=== downloadRknGuide ==='
          grep -RIn --exclude-dir=.git --exclude='maintenance-inspect-legacy-tails.yml' 'downloadRknGuide' . || true
      - name: Remove one-time inspector
        run: |
          git config user.name 'co-tools-maintenance'
          git config user.email 'co-tools-maintenance@users.noreply.github.com'
          git rm .github/workflows/maintenance-inspect-legacy-tails.yml
          git commit -m 'Remove one-time legacy tail inspector'
          git push origin HEAD:staging
