name: Verify Y clean F E lifecycle once

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Check Y FE Z visibility and Professional build
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { setV2Y,clearV2Y } from './ui/v2/y.js';
          import { setV2DeckOpen } from './ui/v2/workspace-navigation.js';
          const classes=new Set();
          const classList={
            add(...xs){xs.forEach(x=>classes.add(x));},
            remove(...xs){xs.forEach(x=>classes.delete(x));},
            contains(x){return classes.has(x);},
            toggle(x,value){const on=value??!classes.has(x);on?classes.add(x):classes.delete(x);return on;}
          };
          const props=new Map();
          const host={
            hidden:true,innerHTML:'',scrollHeight:120,
            style:{paddingBottom:'',setProperty(k,v){props.set(k,v);},removeProperty(k){props.delete(k);}}
          };
          const app={
            matches(x){return x==='[data-v2-app]';},
            querySelector(x){return x===':scope > [data-v2-y-host]'?host:null;},
            classList
          };
          setV2Y(app,'<div>Two notes</div>');
          assert.equal(host.hidden,false);
          assert.equal(props.get('--v2-y-expanded-height'),'120px');
          assert.equal(classes.has('has-v2-y'),true);
          setV2DeckOpen(app,true);
          assert.equal(classes.has('is-deck-open'),true);
          setV2DeckOpen(app,false);
          assert.equal(classes.has('is-deck-open'),false);
          clearV2Y(app);
          assert.equal(host.hidden,true);
          assert.equal(classes.has('has-v2-y'),false);
          const css=fs.readFileSync('ui/v2/v2.css','utf8');
          assert.match(css,/\.is-deck-open,\.is-z-entering\) > \.v2-y-host/);
          assert.match(css,/padding-bottom:0!important/);
          assert.match(css,/\.is-revealing-deck > \.v2-y-host/);
          assert.match(css,/transform:translateX\(var\(--v2-front-drag-x/);
          assert.match(css,/\.is-y-entering > \.v2-y-host > \*/);
          const nav=fs.readFileSync('ui/v2/workspace-navigation.js','utf8');
          assert.match(nav,/event\.target !== front/);
          assert.match(nav,/app\.classList\.add\('is-y-entering'\)/);
          assert.match(nav,/app\.classList\.remove\('is-z-entering'\)/);
          const day=fs.readFileSync('journal/день.js','utf8');
          assert.match(day,/clearV2Y\(root\)/);
          console.log('Y and Z lifecycle contracts PASS');
          NODE
          node -e "import('./ui/ui.js').then(()=>console.log('UI module links PASS'))"
          node -e "import('./journal/journal.js').then(()=>console.log('Journal module links PASS'))"
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          node scripts/audit-professional-clean.mjs
          docker build -t professional-y-fe-z .
      - name: Remove temporary verifier
        if: success()
        run: |
          set -euo pipefail
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git rm .github/workflows/_verify-y-fe-z-once.yml
          git commit -m 'Remove temporary Y FE Z verifier'
          git push origin HEAD:staging
