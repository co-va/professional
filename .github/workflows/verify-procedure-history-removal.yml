name: Diagnose procedure history removal once

on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Build diagnostic report
        shell: bash
        run: |
          set +e
          {
            echo '=== RETIRED REFERENCES ==='
            git grep -n -E 'procedureHistory|pushProcedureHistory|hydrateProceduresFromServer' -- ':!.github/**'
            echo "grep_exit=$?"
            echo
            echo '=== NODE CHECK ==='
            find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -not -path './.github/*' -print0 | xargs -0 -n1 node --check
            echo "node_exit=$?"
            echo
            echo '=== CLEAN AUDIT ==='
            node scripts/audit-professional-clean.mjs
            echo "audit_exit=$?"
          } > procedure-history-diagnostic.txt 2>&1
          cat procedure-history-diagnostic.txt
      - uses: actions/upload-artifact@v4
        with:
          name: procedure-history-diagnostic
          path: procedure-history-diagnostic.txt
