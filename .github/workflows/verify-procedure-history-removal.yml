name: Verify procedure history removal once

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Verify removed history model
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=.github 'procedureHistory|pushProcedureHistory|hydrateProceduresFromServer' .; then
            echo 'Retired procedure history references remain.'
            exit 1
          fi
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          node scripts/audit-professional-clean.mjs
      - name: Remove one-shot workflow
        if: success()
        run: |
          rm .github/workflows/verify-procedure-history-removal.yml
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git add -A
          git commit -m 'Remove one-shot procedure history verifier'
          git push origin HEAD:staging
