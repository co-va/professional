name: Verify Y Z F E lifecycle once

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Check Y lifecycle and Professional build
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { setV2Y, clearV2Y } from './ui/v2/y.js';
          import { setV2DeckOpen } from './ui/v2/workspace-navigation.js';
          const classes = new Set();
          const classList = {
            add(...keys){keys.forEach(k=>classes.add(k));},
            remove(...keys){keys.forEach(k=>classes.delete(k));},
            contains(k){return classes.has(k);},
            toggle(k,on){if(on===undefined)on=!classes.has(k);on?classes.add(k):classes.delete(k);return on;}
          };
          const properties = new Map();
          const host = {
            hidden:true,innerHTML:'',scrollHeight:112,
            style:{
              paddingBottom:'',
              setProperty(k,v){properties.set(k,v);},
              removeProperty(k){properties.delete(k);}
            }
          };
          const app = {
            classList,
            matches(sel){return sel==='[data-v2-app]';},
            querySelector(sel){return sel===':scope > [data-v2-y-host]'?host:null;}
          };
          assert.equal(setV2Y(app,'<div>Note sticker</div>'),host);
          assert.equal(host.hidden,false);
          assert.equal(properties.get('--v2-y-expanded-height'),'112px');
          assert.ok(classes.has('has-v2-y'));
          setV2DeckOpen(app,true);
          assert.ok(classes.has('is-deck-open'));
          classes.add('is-z-entering');
          setV2DeckOpen(app,false);
          assert.ok(!classes.has('is-deck-open') && classes.has('is-z-entering'));
          clearV2Y(app);
          assert.equal(host.hidden,true);
          assert.ok(!classes.has('has-v2-y'));
          assert.ok(!properties.has('--v2-y-expanded-height'));
          const css=fs.readFileSync('ui/v2/v2.css','utf8');
          const nav=fs.readFileSync('ui/v2/workspace-navigation.js','utf8');
          const journal=fs.readFileSync('journal/journal.js','utf8');
          const day=fs.readFileSync('journal/день.js','utf8');
          assert.match(css,/is-deck-open,\.is-z-entering\) > \.v2-y-host/);
          assert.match(css,/is-revealing-deck > \.v2-y-host/);
          assert.match(css,/translateX\(var\(--v2-front-drag-x/);
          assert.match(css,/max-height:\s*0;opacity:\s*0/);
          assert.match(css,/v2-y-enter-from-right/);
          assert.match(nav,/event\.target !== front/);
          assert.match(nav,/app\.classList\.add\('is-y-entering'\)/);
          assert.match(nav,/app\.classList\.remove\('is-z-entering'\)/);
          assert.match(day,/clearV2Y\(root\)/);
          assert.match(journal,/disposeActiveView\(\);/);
          console.log('Y deck hiding, Z entry, gesture coupling and cleanup OK');
          NODE
          node -e "import('./ui/ui.js').then(() => console.log('shared UI module links OK'))"
          node -e "import('./journal/journal.js').then(() => console.log('Journal module links OK'))"
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          node scripts/audit-professional-clean.mjs
          git diff --check
          docker build -t professional-y-z-fe-lifecycle .
      - name: Remove temporary verifier
        if: success()
        run: |
          set -euo pipefail
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git rm .github/workflows/_verify-y-z-fe-lifecycle.yml
          git commit -m 'Remove temporary Y Z F E verifier'
          git push origin HEAD:staging
