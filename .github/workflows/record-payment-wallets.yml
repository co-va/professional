name: Record payment wallet sources

on:
  push:
    branches: [staging]
    paths:
      - 'core/payment/**'
      - 'core/finance/**'
      - 'core/runtime/auxiliary-state.js'
      - 'ui/payment/**'
      - 'scripts/ci/record-payment-wallets-smoke.mjs'
      - '.github/workflows/record-payment-wallets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-payment-wallets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-wallets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify existing wallets on cold Record payment
        run: node scripts/ci/record-payment-wallets-smoke.mjs
