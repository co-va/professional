name: Audit Professional Journal semantics once

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Collect Journal semantics
        run: |
          set -euo pipefail
          {
            echo '=== soft-hard ==='
            grep -RInE 'rigidity|softTime|SoftTime|releaseWorkingTimeSoftUsages|configureSoftTimeUsageReleaseSource|releaseJournalSoftTimeUsages' journal core/time core/day timetable professional.js || true
            echo '=== account-user-generic ==='
            grep -RInE "scope:[[:space:]]*['\"]account['\"]|accountMode|data-account|cova:account|customActions|eventActions|noteActions|targetSource" journal core/time core/day timetable professional.js || true
            echo '=== overlap-bypass ==='
            grep -RInE 'overlap|occupied|outside-working|day-not-working|excludeId|removeEventsForDay' journal core/time core/day timetable professional.js || true
          } > /tmp/journal-audit.txt
          cat /tmp/journal-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: professional-journal-audit
          path: /tmp/journal-audit.txt
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/_journal-professional-audit.yml
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git add -A
          git commit -m 'Remove one-shot Journal audit'
          git push origin HEAD:staging
