name: Verify Journal first Q reset once

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Verify chooser isolation and clean build
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const q = fs.readFileSync('journal/creation-flow.js','utf8');
          const owner = fs.readFileSync('ui/record/creation-flow.js','utf8');
          const records = fs.readFileSync('core/records/records.js','utf8');
          assert.match(q, /shellTitle: ''/);
          assert.match(owner, /shellTitle = 'Запись'/);
          assert.match(owner, /title: shellTitle/);
          assert.doesNotMatch(q,/let activeMode|let eventFlow|let noteFlow|recordFlow/);
          assert.match(q, /activeView: 'record'/);
          assert.match(q, /if \(mode !== 'event' && mode !== 'note'\) return;/);
          assert.match(q, /void beginAuxiliary\(mode, version\)/);
          assert.match(q, /showEntityLoading\(mode\)/);
          assert.match(q, /owner\.setBackHandler\?\.\(returnToChoices\)/);
          assert.match(q, /selectedTime = '';\s*showTimeChoices\(\)/);
          assert.match(q, /createJournalEventFlow\(\{ owner, date, workplaceId, timeHint, onCreated \}\)/);
          assert.match(q, /createJournalNoteFlow\(\{ owner, date, onCreated \}\)/);
          assert.match(q, /timeHint: selectedTime,\s*journalTimeConfirmed: true/);
          assert.match(q, /onBackFromStart: returnToChoices/);
          assert.match(records, /if \(journalTimeConfirmed\) \{\s*state.from = state.timeHint;\s*renderProcedures\(\)/);
          assert.match(q, /version !== requestVersion/);
          const day=fs.readFileSync('journal/день.js','utf8');
          assert.match(day, /timeGrid,\s*onCreated/);
          assert.doesNotMatch(day, /surfaceRoot: root.closest/);
          console.log('First Q transition, reset and Record-time contracts OK');
          NODE
          node -e "import('./journal/creation-flow.js').then(() => console.log('chooser module link OK'))"
          node -e "import('./journal/event-create.js').then(() => console.log('Event module link OK'))"
          node -e "import('./journal/note-create.js').then(() => console.log('Note module link OK'))"
          node -e "import('./core/records/records.js').then(() => console.log('Record module link OK'))"
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          node scripts/audit-professional-clean.mjs
          git diff --check
          docker build -t professional-chooser-reset .
      - name: Remove temporary verifier
        if: success()
        run: |
          set -euo pipefail
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git rm .github/workflows/_verify-journal-first-q-reset.yml
          git commit -m 'Remove temporary Journal first Q reset verifier'
          git push origin HEAD:staging
